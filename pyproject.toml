[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-mcp"
version = "0.1.0"
description = "MCP server to access Garmin Connect data, compatible with Gemini and other MCP clients"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "python-dotenv>=1.0.0",
    "garminconnect>=0.3.2",
    "requests>=2.31.0",
    "mcp[cli]>=1.0.0,<2.0.0",
    "python-telegram-bot[webhooks]>=21.0",
    "google-genai>=1.0.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-mcp-auth = "garmin_mcp.auth_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
